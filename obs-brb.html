<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--warm:#F4F1EC;--mute:#b7b1bb;--hot:#FF2E7E;}
  *{box-sizing:border-box;margin:0;padding:0;}
  #s{position:relative;width:1920px;height:1080px;background:#0A0A0B;overflow:hidden;font-family:'Inter',sans-serif;color:var(--warm);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .photo{position:absolute;inset:0;background:url('assets/bio/couple-src.jpg') center 16%/cover no-repeat;}
  .scrim{position:absolute;inset:0;background:
    linear-gradient(180deg,rgba(10,10,11,.72) 0%,rgba(10,10,11,.55) 40%,rgba(10,10,11,.8) 100%);}
  .vig{position:absolute;inset:0;box-shadow:inset 0 0 260px 80px rgba(0,0,0,.7);}
  .edge{position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,rgba(255,46,126,0),var(--hot) 50%,rgba(255,46,126,0));}
  .ey{position:relative;font-weight:500;font-size:26px;letter-spacing:.5em;text-transform:uppercase;color:var(--hot);text-shadow:0 2px 18px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,.7);margin-bottom:30px;}
  h1{position:relative;font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:150px;line-height:.96;letter-spacing:0;text-shadow:0 10px 50px rgba(0,0,0,.6);}
  .sub{position:relative;margin-top:30px;font-size:34px;font-weight:300;color:var(--mute);}
  .dots{position:relative;margin-top:40px;display:flex;gap:14px;}
  .dots span{width:14px;height:14px;border-radius:50%;background:var(--hot);opacity:.85;}
  .dots span:nth-child(2){opacity:.55;}.dots span:nth-child(3){opacity:.3;}
  .foot{position:absolute;left:0;right:0;bottom:56px;text-align:center;font-weight:500;font-size:24px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);}
  .foot b{color:var(--warm);}
</style></head>
<body>
<div id="s">
  <div class="photo"></div><div class="scrim"></div><div class="vig"></div><div class="edge"></div>
  <div class="ey">Rebi &amp; Ricci</div>
  <h1>Be right back</h1>
  <div class="sub">Grab a drink — we're back in a sec.</div>
  <div class="dots"><span></span><span></span><span></span></div>
  <div class="foot">Don't go anywhere &nbsp;·&nbsp; <b>Fansly: dreamcouple69</b></div>
</div>
</body></html>
