<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--panel:#0B0B0C;--line:#232326;--warm:#F2EFEA;--mute:#8b8690;--hot:#FF2E7E;}
  *{box-sizing:border-box;margin:0;padding:0;}
  .bar{width:1920px;height:980px;display:flex;background:var(--panel);overflow:hidden;font-family:'Archivo',sans-serif;color:var(--warm);}
  .txt{flex:0 0 54%;padding:88px 70px 88px 300px;display:flex;flex-direction:column;justify-content:center;}
  .eyebrow{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:26px;letter-spacing:.36em;text-transform:uppercase;color:var(--hot);margin-bottom:22px;}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:96px;line-height:.94;letter-spacing:-.01em;text-transform:uppercase;}
  .loves{list-style:none;margin-top:34px;}
  .loves li{display:flex;gap:18px;align-items:baseline;padding:13px 0;font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:36px;line-height:1.2;color:#d8d4dc;}
  .loves li::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--hot);transform:translateY(-6px);}
  .handle{margin-top:38px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;letter-spacing:.02em;color:var(--warm);}
  .handle span{color:var(--mute);font-weight:600;font-size:24px;letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:4px;}
  .tap{margin-top:26px;display:inline-flex;align-items:center;gap:12px;align-self:flex-start;background:var(--hot);color:#0B0B0C;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:16px 30px;border-radius:8px;}
  .phwrap{flex:1;position:relative;}
  .phwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.4) 24%,#000 52%);mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.4) 24%,#000 52%);}
</style></head>
<body>
<div class="bar">
  <div class="txt">
    <div class="eyebrow">The two of us</div>
    <h1>We're a fit<br>gym couple</h1>
    <ul class="loves">
      <li>We love making you feel welcome.</li>
      <li>We love trying out your fantasies.</li>
      <li>We love fucking hard in front of you.</li>
    </ul>
    <div class="handle"><span>Our Fansly — the two of us</span>dreamcouple69</div>
    <div class="tap">Click here to open our Fansly</div>
  </div>
  <div class="phwrap"><img src="assets/bio/hero-src.jpg"></div>
</div>
</body></html>
