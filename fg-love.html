<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--cream:#F5F1E9;--ink:#141210;--soft:#5c574f;--hot:#E11466;--line:rgba(20,18,16,.12);}
  *{box-sizing:border-box;margin:0;padding:0;}
  /* couple — off-white block */
  .bar{width:1920px;height:1120px;display:flex;align-items:stretch;background:var(--cream);font-family:'Inter',sans-serif;color:var(--ink);}
  .txt{flex:0 0 52%;padding:110px 90px 110px 300px;display:flex;flex-direction:column;justify-content:center;}
  .eyebrow{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--hot);margin-bottom:30px;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:78px;line-height:1.02;letter-spacing:-.025em;}
  .lead{margin-top:34px;font-size:30px;font-weight:300;line-height:1.5;color:var(--soft);max-width:22ch;}
  .scarcity{margin-top:40px;display:inline-flex;align-self:flex-start;align-items:center;gap:12px;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:21px;letter-spacing:.01em;color:var(--ink);background:rgba(225,20,102,.1);border:1px solid rgba(225,20,102,.35);border-radius:999px;padding:12px 22px;}
  .scarcity .dot{width:9px;height:9px;border-radius:50%;background:var(--hot);}
  .handle{margin-top:44px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:38px;letter-spacing:-.01em;color:var(--ink);}
  .handle span{display:block;font-family:'Inter',sans-serif;font-weight:500;font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-bottom:8px;}
  .tap{margin-top:26px;display:inline-flex;align-items:center;gap:14px;align-self:flex-start;background:var(--hot);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:26px;letter-spacing:.01em;padding:18px 38px;border-radius:999px;}
  .media{flex:1;padding:90px 90px 90px 50px;display:flex;}
  .card{flex:1;position:relative;border-radius:20px;overflow:hidden;box-shadow:0 40px 90px rgba(20,18,16,.28);}
  .card .ph{position:absolute;inset:0;background:url('assets/bio/hero-src.jpg') center 20%/cover no-repeat;}
</style></head>
<body>
<div class="bar">
  <div class="txt">
    <div class="eyebrow">Us two · Fansly</div>
    <h1>The stuff we<br>can't post here.</h1>
    <div class="lead">Full videos, our messy private nights, everything CB won't let us show.</div>
    <div class="scarcity"><span class="dot"></span>Intro price won't last</div>
    <div class="handle"><span>We're at</span>dreamcouple69</div>
    <div class="tap">Come find us &#8594;</div>
  </div>
  <div class="media"><div class="card"><div class="ph"></div></div></div>
</div>
</body></html>
