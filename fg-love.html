<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--cream:#F5F1E9;--ink:#141210;--soft:#5c574f;--hot:#E11466;--line:rgba(20,18,16,.12);}
  *{box-sizing:border-box;margin:0;padding:0;}
  .bar{width:1920px;height:1120px;display:flex;align-items:stretch;background:var(--cream);font-family:'Inter',sans-serif;color:var(--ink);}
  .txt{flex:0 0 52%;padding:110px 90px 110px 320px;display:flex;flex-direction:column;justify-content:center;}
  .eyebrow{font-weight:500;font-size:17px;letter-spacing:.26em;text-transform:uppercase;color:var(--hot);margin-bottom:24px;}
  h1{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:60px;line-height:1.05;letter-spacing:0;}
  .lead{margin-top:28px;font-size:23px;font-weight:300;line-height:1.5;color:var(--soft);max-width:24ch;}
  .scarcity{margin-top:34px;display:inline-flex;align-self:flex-start;align-items:center;gap:11px;font-weight:500;font-size:16px;color:var(--ink);background:rgba(225,20,102,.1);border:1px solid rgba(225,20,102,.35);border-radius:999px;padding:10px 20px;}
  .scarcity .dot{width:8px;height:8px;border-radius:50%;background:var(--hot);}
  .handle{margin-top:38px;font-weight:600;font-size:30px;letter-spacing:-.01em;color:var(--ink);}
  .handle span{display:block;font-weight:500;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-bottom:7px;}
  .tap{margin-top:24px;display:inline-flex;align-items:center;gap:12px;align-self:flex-start;background:var(--hot);color:#fff;font-weight:600;font-size:20px;letter-spacing:.01em;padding:15px 32px;border-radius:999px;}
  .media{flex:1;padding:96px 90px 96px 50px;display:flex;}
  .card{flex:1;position:relative;border-radius:18px;overflow:hidden;box-shadow:0 40px 90px rgba(20,18,16,.28);}
  .card .ph{position:absolute;inset:0;background:url('assets/bio/hero-src.jpg') center 20%/cover no-repeat;}
</style></head>
<body>
<div class="bar">
  <div class="txt">
    <div class="eyebrow">Us two · Fansly</div>
    <h1>The stuff we<br>can't post here.</h1>
    <div class="lead">Full videos, our messy private nights, everything CB won't let us show.</div>
    <div class="scarcity"><span class="dot"></span>Intro price won't last</div>
    <div class="handle"><span>We're at</span>dreamcouple69</div>
    <div class="tap">Come find us (click) &#8594;</div>
  </div>
  <div class="media"><div class="card"><div class="ph"></div></div></div>
</div>
</body></html>
