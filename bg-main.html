<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  #bg{position:relative;width:1920px;height:1240px;background:#08080A;overflow:hidden;}
  /* soft warm glow, upper */
  .g-warm{position:absolute;left:50%;top:26%;width:1560px;height:1160px;transform:translate(-50%,-50%);
    background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(245,241,233,.10) 0%,rgba(245,241,233,.03) 40%,rgba(245,241,233,0) 70%);
    filter:blur(30px);}
  /* pink aurora, lower right */
  .g-pink{position:absolute;left:74%;top:70%;width:1240px;height:1240px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,46,126,.20) 0%,rgba(255,46,126,.05) 42%,rgba(255,46,126,0) 64%);
    filter:blur(40px);}
  /* cool aurora, lower left */
  .g-cool{position:absolute;left:22%;top:78%;width:1100px;height:1100px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(120,130,180,.08) 0%,rgba(120,130,180,0) 58%);
    filter:blur(44px);}
  /* faint second pink, upper left for balance */
  .g-pink2{position:absolute;left:24%;top:20%;width:820px;height:820px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,46,126,.06) 0%,rgba(255,46,126,0) 60%);filter:blur(46px);}
  /* glassy diagonal sheen */
  .sheen{position:absolute;left:-10%;top:-30%;width:130%;height:80%;transform:rotate(-14deg);
    background:linear-gradient(100deg,rgba(255,255,255,0) 34%,rgba(255,255,255,.035) 50%,rgba(255,255,255,0) 66%);
    filter:blur(30px);}
  /* vignette */
  .vig{position:absolute;inset:0;
    background:radial-gradient(ellipse 70% 66% at 50% 46%,rgba(8,8,10,0) 40%,rgba(6,6,8,.6) 82%,rgba(4,4,6,.9) 100%);}
</style></head>
<body>
<div id="bg">
  <div class="g-warm"></div>
  <div class="g-cool"></div>
  <div class="g-pink"></div>
  <div class="g-pink2"></div>
  <div class="sheen"></div>
  <div class="vig"></div>
</div>
</body></html>
