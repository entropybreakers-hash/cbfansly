<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--hot:#FF2E7E;--warm:#F2EFEA;--mute:#8b8690;}
  *{box-sizing:border-box;margin:0;padding:0;}
  #bg{position:relative;width:1920px;height:1200px;background:#0B0B0C;overflow:hidden;font-family:'Archivo',sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .edge{position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,rgba(255,46,126,0),var(--hot) 50%,rgba(255,46,126,0));}
  .glow{position:absolute;left:50%;top:48%;width:900px;height:900px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,46,126,.14) 0%,rgba(255,46,126,0) 60%);}
  .ey{position:relative;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:30px;letter-spacing:.5em;
    text-transform:uppercase;color:var(--hot);margin-bottom:34px;padding-left:.5em;}
  .card{position:relative;width:560px;height:748px;border-radius:16px;overflow:hidden;
    border:1px solid rgba(242,239,231,.14);box-shadow:0 40px 100px rgba(0,0,0,.6);}
  .card::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 90px 10px rgba(0,0,0,.35);}
  .card .ph{position:absolute;inset:0;background:url('assets/bio/couple-src.jpg') center 18%/cover no-repeat;}
  .nm{position:relative;margin-top:40px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:60px;
    line-height:1;letter-spacing:.02em;text-transform:uppercase;color:var(--warm);text-align:center;}
  .tag{position:relative;margin-top:16px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:24px;
    letter-spacing:.34em;text-transform:uppercase;color:var(--mute);text-align:center;}
  .tag b{color:var(--hot);font-weight:700;}
</style></head>
<body>
<div id="bg">
  <div class="edge"></div>
  <div class="glow"></div>
  <div class="ey">Rebi &amp; Ricci</div>
  <div class="card"><div class="ph"></div></div>
  <div class="nm">Fit gym couple</div>
  <div class="tag">Fansly &nbsp;·&nbsp; <b>scroll down</b></div>
</div>
</body></html>
