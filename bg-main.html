<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--hot:#FF2E7E;--warm:#F2EFEA;--mute:#8b8690;}
  *{box-sizing:border-box;margin:0;padding:0;}
  #bg{position:relative;width:1920px;height:1200px;background:#0B0B0C;overflow:hidden;font-family:'Archivo',sans-serif;}
  /* couple photo occupies the right ~64%; left 36% stays pure black for CB's labels */
  .photo{position:absolute;top:0;bottom:0;right:0;width:64%;
    background:url('assets/bio/couple-src.jpg') center 16%/cover no-repeat;}
  /* soft fade from the black label column into the photo (no hard seam) */
  .seam{position:absolute;top:0;bottom:0;left:30%;width:22%;
    background:linear-gradient(90deg,#0B0B0C 0%,rgba(11,11,12,.6) 40%,rgba(11,11,12,0) 100%);}
  /* gentle top + bottom vignette to seat the brand and labels */
  .vig{position:absolute;inset:0;background:
    linear-gradient(180deg,rgba(11,11,12,.5) 0%,rgba(11,11,12,0) 26%,rgba(11,11,12,0) 62%,rgba(11,11,12,.85) 100%);}
  .glow{position:absolute;right:-160px;bottom:-220px;width:760px;height:760px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,46,126,.20) 0%,rgba(255,46,126,0) 62%);}
  .edge{position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--hot),rgba(255,46,126,0) 60%);}
  .brand{position:absolute;right:70px;bottom:60px;text-align:right;}
  .brand .ey{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:30px;letter-spacing:.42em;
    text-transform:uppercase;color:var(--hot);margin-bottom:12px;}
  .brand .nm{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:120px;line-height:.88;
    letter-spacing:-.01em;text-transform:uppercase;color:var(--warm);text-shadow:0 6px 30px rgba(0,0,0,.55);}
  .brand .tag{margin-top:16px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:28px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--mute);}
  .brand .tag b{color:var(--hot);font-weight:700;}
</style></head>
<body>
<div id="bg">
  <div class="photo"></div>
  <div class="seam"></div>
  <div class="vig"></div>
  <div class="glow"></div>
  <div class="edge"></div>
  <div class="brand">
    <div class="ey">Rebi &amp; Ricci</div>
    <div class="nm">Fit gym<br>couple</div>
    <div class="tag">Fansly &nbsp;·&nbsp; <b>scroll down</b></div>
  </div>
</div>
</body></html>
