<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  #bg{position:relative;width:1920px;height:1240px;background:#0A0A0B;overflow:hidden;
    display:flex;align-items:center;justify-content:center;}
  /* soft off-white halo behind the photo */
  .cream{position:absolute;left:50%;top:49%;width:1020px;height:820px;transform:translate(-50%,-50%);
    background:radial-gradient(ellipse 50% 52% at 50% 50%,rgba(245,241,233,.34) 0%,rgba(245,241,233,.12) 52%,rgba(245,241,233,0) 76%);}
  .glow{position:absolute;left:50%;top:50%;width:900px;height:900px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,46,126,.08) 0%,rgba(255,46,126,0) 62%);}
  /* wider frame, softer oval fade */
  .frame{position:relative;width:660px;height:800px;
    background:url('assets/bio/newhero.JPEG') 50% 46%/200% auto no-repeat;
    -webkit-mask-image:radial-gradient(ellipse 62% 60% at 50% 46%,#000 40%,rgba(0,0,0,0) 100%);
            mask-image:radial-gradient(ellipse 62% 60% at 50% 46%,#000 40%,rgba(0,0,0,0) 100%);}
</style></head>
<body>
<div id="bg">
  <div class="cream"></div>
  <div class="glow"></div>
  <div class="frame"></div>
</div>
</body></html>
