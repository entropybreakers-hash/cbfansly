<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  #bg{position:relative;width:1920px;height:1240px;background:#000000;overflow:hidden;}
  /* soft warm glow, upper center */
  .g-warm{position:absolute;left:50%;top:24%;width:1500px;height:1100px;transform:translate(-50%,-50%);
    background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(250,240,236,.08) 0%,rgba(250,240,236,.02) 42%,rgba(250,240,236,0) 72%);
    filter:blur(34px);}
  /* main pink aurora, lower right */
  .g-pink{position:absolute;left:73%;top:68%;width:1300px;height:1300px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,90,150,.26) 0%,rgba(255,90,150,.07) 40%,rgba(255,90,150,0) 64%);
    filter:blur(46px);}
  /* deeper rose, upper left */
  .g-rose{position:absolute;left:24%;top:26%;width:1080px;height:1080px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(224,68,122,.20) 0%,rgba(224,68,122,.04) 46%,rgba(224,68,122,0) 66%);
    filter:blur(50px);}
  /* soft pink haze, lower left for balance */
  .g-pink2{position:absolute;left:20%;top:82%;width:900px;height:900px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,111,165,.14) 0%,rgba(255,111,165,0) 60%);filter:blur(48px);}
  /* glassy diagonal sheen */
  .sheen{position:absolute;left:-10%;top:-30%;width:130%;height:80%;transform:rotate(-14deg);
    background:linear-gradient(100deg,rgba(255,255,255,0) 34%,rgba(255,255,255,.04) 50%,rgba(255,255,255,0) 66%);
    filter:blur(34px);}
  /* vignette */
  .vig{position:absolute;inset:0;
    background:radial-gradient(ellipse 72% 68% at 50% 46%,rgba(10,7,9,0) 40%,rgba(8,5,7,.55) 82%,rgba(6,4,6,.88) 100%);}
</style></head>
<body>
<div id="bg">
  <div class="g-warm"></div>
  <div class="g-rose"></div>
  <div class="g-pink"></div>
  <div class="g-pink2"></div>
  <div class="sheen"></div>
  <div class="vig"></div>
</div>
</body></html>
