<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--warm:#F4F1EC;--mute:#c7c2cb;--hot:#FF2E7E;}
  *{box-sizing:border-box;margin:0;padding:0;}
  #h{position:relative;width:960px;height:1120px;background:#0A0A0B;overflow:hidden;font-family:'Inter',sans-serif;color:var(--warm);}
  .ph{position:absolute;inset:0;background:url('assets/bio/hero-src.jpg') center 26%/cover no-repeat;}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,11,.55) 0%,rgba(10,10,11,0) 26%,rgba(10,10,11,0) 44%,rgba(10,10,11,.78) 78%,rgba(10,10,11,.95) 100%);}
  .badge{position:absolute;top:132px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:9px;
    background:var(--hot);color:#0A0A0B;font-weight:700;font-size:17px;letter-spacing:.12em;text-transform:uppercase;padding:11px 22px;border-radius:999px;
    box-shadow:0 10px 30px rgba(255,46,126,.4);white-space:nowrap;}
  .cap{position:absolute;left:0;right:0;bottom:150px;text-align:center;padding:0 40px;}
  .ey{font-weight:500;font-size:16px;letter-spacing:.28em;text-transform:uppercase;color:var(--hot);margin-bottom:12px;}
  .hn{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:52px;line-height:1;letter-spacing:0;margin-bottom:28px;}
  .btn{display:inline-flex;align-items:center;gap:12px;background:var(--hot);color:#0A0A0B;font-weight:700;font-size:24px;padding:18px 40px;border-radius:999px;box-shadow:0 16px 44px rgba(255,46,126,.4);}
</style></head>
<body>
<div id="h">
  <div class="ph"></div>
  <div class="scrim"></div>
  <div class="badge"><span>&#9889;</span>Free video · this week</div>
  <div class="cap">
    <div class="ey">Us two</div>
    <div class="hn">dreamcouple69</div>
    <div class="btn">Open our page (click) &#8594;</div>
  </div>
</div>
</body></html>
