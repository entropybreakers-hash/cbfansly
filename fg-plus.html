<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#120309;--soft:rgba(18,3,9,.66);--line:rgba(18,3,9,.16);}
  *{box-sizing:border-box;margin:0;padding:0;}
  /* what you get — vivid pink block */
  .bar{width:1920px;height:900px;background:#FF2E7E;font-family:'Inter',sans-serif;color:var(--ink);
    display:flex;flex-direction:column;justify-content:center;padding:0 300px;}
  .eyebrow{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);opacity:.7;margin-bottom:26px;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:88px;line-height:1;letter-spacing:-.025em;margin-bottom:60px;}
  .grid{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:0 120px;max-width:1260px;}
  .grid li{display:flex;gap:22px;align-items:baseline;padding:30px 0;border-bottom:1px solid var(--line);
    font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:33px;line-height:1.24;letter-spacing:-.01em;}
  .grid li::before{content:"";flex:none;width:13px;height:13px;border-radius:50%;background:var(--ink);transform:translateY(-4px);}
  .foot{margin-top:52px;font-size:29px;font-weight:300;color:var(--soft);}
  .foot b{color:var(--ink);font-weight:500;}
</style></head>
<body>
<div class="bar">
  <div class="eyebrow">Now the fun part</div>
  <h1>What you get</h1>
  <ul class="grid">
    <li>You'll always feel welcome here.</li>
    <li>Your fantasies — we love trying them.</li>
    <li>We fuck hard, right in front of you.</li>
    <li>Private shows when you spoil us.</li>
  </ul>
  <div class="foot">Tip for something and we do it <b>properly</b> — no half measures.</div>
</div>
</body></html>
