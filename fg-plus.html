<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--warm:#F4F1EC;--mute:#8b8690;--hot:#FF2E7E;--line:rgba(244,241,236,.12);}
  *{box-sizing:border-box;margin:0;padding:0;}
  .bar{width:1920px;height:1120px;background:#0A0A0B;font-family:'Inter',sans-serif;color:var(--warm);
    display:flex;flex-direction:column;justify-content:center;padding:0 320px;}
  .eyebrow{font-weight:500;font-size:17px;letter-spacing:.28em;text-transform:uppercase;color:var(--hot);margin-bottom:22px;}
  h1{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:64px;line-height:1.0;letter-spacing:0;margin-bottom:50px;}
  .grid{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:0 110px;max-width:1180px;}
  .grid li{display:flex;gap:20px;align-items:baseline;padding:24px 0;border-bottom:1px solid var(--line);
    font-size:25px;font-weight:400;line-height:1.28;color:var(--warm);}
  .grid li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--hot);transform:translateY(-3px);}
  .foot{margin-top:44px;font-size:23px;font-weight:300;color:#c7c2cb;}
  .foot b{color:var(--warm);font-weight:500;}
</style></head>
<body>
<div class="bar">
  <div class="eyebrow">The good stuff</div>
  <h1>What you get</h1>
  <ul class="grid">
    <li>You'll feel right at home.</li>
    <li>Got a fantasy? We're so down.</li>
    <li>We fuck in public, not just private.</li>
    <li>Private shows when you treat us right.</li>
  </ul>
  <div class="foot">You tip for it, we do it for <b>real</b>. No teasing you and bailing.</div>
</div>
</body></html>
