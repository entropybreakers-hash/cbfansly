<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--warm:#F4F1EC;--mute:#8b8690;--hot:#FF2E7E;--line:rgba(244,241,236,.12);}
  *{box-sizing:border-box;margin:0;padding:0;}
  /* what you get — black */
  .bar{width:1920px;height:1120px;background:#0A0A0B;font-family:'Inter',sans-serif;color:var(--warm);
    display:flex;flex-direction:column;justify-content:center;padding:0 300px;}
  .eyebrow{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--hot);margin-bottom:26px;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:88px;line-height:1;letter-spacing:-.025em;margin-bottom:60px;}
  .grid{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:0 120px;max-width:1260px;}
  .grid li{display:flex;gap:22px;align-items:baseline;padding:30px 0;border-bottom:1px solid var(--line);
    font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:33px;line-height:1.24;letter-spacing:-.01em;color:var(--warm);}
  .grid li::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--hot);transform:translateY(-4px);}
  .foot{margin-top:52px;font-size:29px;font-weight:300;color:#c7c2cb;}
  .foot b{color:var(--warm);font-weight:500;}
</style></head>
<body>
<div class="bar">
  <div class="eyebrow">The good stuff</div>
  <h1>What you get</h1>
  <ul class="grid">
    <li>You'll feel right at home.</li>
    <li>Got a fantasy? We're so down.</li>
    <li>We fuck in public, not just private.</li>
    <li>Private shows when you treat us right.</li>
  </ul>
  <div class="foot">You tip for it, we do it for <b>real</b>. No teasing you and bailing.</div>
</div>
</body></html>
