<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--warm:#F4F1EC;--mute:#a49ea8;--hot:#FF2E7E;}
  *{box-sizing:border-box;margin:0;padding:0;}
  #b{position:relative;width:1600px;height:400px;background:#0A0A0B;overflow:hidden;font-family:'Inter',sans-serif;color:var(--warm);}
  .photo{position:absolute;top:0;bottom:0;right:0;width:58%;background:url('assets/bio/hero-src.jpg') center 24%/cover no-repeat;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.4) 20%,#000 52%);mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.4) 20%,#000 52%);}
  .glow{position:absolute;right:-120px;bottom:-170px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,46,126,.16) 0%,rgba(255,46,126,0) 62%);}
  .edge{position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--hot),rgba(255,46,126,0) 55%);}
  .txt{position:absolute;left:160px;top:50%;transform:translateY(-50%);}
  h1{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:88px;line-height:.98;letter-spacing:0;}
  .sub{margin-top:18px;font-size:24px;font-weight:300;letter-spacing:.02em;color:var(--mute);}
</style></head>
<body>
<div id="b">
  <div class="photo"></div>
  <div class="glow"></div>
  <div class="edge"></div>
  <div class="txt">
    <h1>Rebi &amp; Ricci</h1>
    <div class="sub">Uncut &amp; unfiltered. Full-length scenes.</div>
  </div>
</div>
</body></html>
