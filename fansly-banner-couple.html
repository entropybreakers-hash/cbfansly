<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--warm:#F4F1EC;--mute:#8b8690;--hot:#FF2E7E;}
  *{box-sizing:border-box;margin:0;padding:0;}
  #b{position:relative;width:1600px;height:400px;background:#0A0A0B;overflow:hidden;font-family:'Inter',sans-serif;color:var(--warm);}
  .photo{position:absolute;top:0;bottom:0;right:0;width:56%;background:url('assets/bio/couple-src.jpg') center 20%/cover no-repeat;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.4) 22%,#000 55%);mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.4) 22%,#000 55%);}
  .glow{position:absolute;right:-120px;bottom:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,46,126,.2) 0%,rgba(255,46,126,0) 62%);}
  .edge{position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--hot),rgba(255,46,126,0) 55%);}
  .txt{position:absolute;left:80px;top:50%;transform:translateY(-50%);}
  .ey{font-weight:500;font-size:20px;letter-spacing:.34em;text-transform:uppercase;color:var(--hot);margin-bottom:16px;}
  h1{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:76px;line-height:.98;letter-spacing:0;}
  .sub{margin-top:16px;font-size:24px;font-weight:300;color:#c7c2cb;}
  .handle{margin-top:20px;display:inline-flex;align-items:center;gap:12px;font-weight:600;font-size:26px;color:var(--warm);}
  .handle .p{font-weight:500;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--hot);background:rgba(255,46,126,.12);border:1px solid rgba(255,46,126,.4);border-radius:999px;padding:5px 14px;}
</style></head>
<body>
<div id="b">
  <div class="photo"></div>
  <div class="glow"></div>
  <div class="edge"></div>
  <div class="txt">
    <div class="ey">Fit gym couple</div>
    <h1>Rebi &amp; Ricci</h1>
    <div class="sub">Uncut. Full scenes. The two of us.</div>
    <div class="handle"><span class="p">Fansly</span>dreamcouple69</div>
  </div>
</div>
</body></html>
