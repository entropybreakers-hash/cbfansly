<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
#hero{position:relative;width:720px;height:900px;overflow:hidden;background:#0a0806;font-family:sans-serif}
.ph{position:absolute;inset:-4%;background:url('assets/hero.jpg') center 20%/cover no-repeat;
  transform-origin:52% 40%;animation:kb 3s ease-in-out infinite}
@keyframes kb{0%{transform:scale(1.05)}50%{transform:scale(1.11)}100%{transform:scale(1.05)}}
.scrim{position:absolute;inset:0;background:
  radial-gradient(90% 70% at 50% 30%,transparent 0%,rgba(10,8,6,.25) 60%,rgba(10,8,6,.6) 100%),
  linear-gradient(180deg,rgba(10,8,6,.12) 0%,rgba(10,8,6,.35) 45%,rgba(10,8,6,.94) 100%)}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 140px 40px rgba(0,0,0,.6)}
.cap{position:absolute;left:0;right:0;bottom:60px;text-align:center}
.ey{font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:7px;text-transform:uppercase;
  color:#e6bd5f;margin-bottom:20px;animation:fade 3s ease-in-out infinite}
@keyframes fade{0%,100%{opacity:.7}50%{opacity:1}}
.nm{position:relative;display:inline-block;font-family:"Cormorant Garamond",serif;font-weight:600;
  font-size:90px;line-height:.92;letter-spacing:-1px;
  background:linear-gradient(100deg,#fff 0%,#fff 34%,#fff7e2 44%,#ffe6a8 50%,#fff7e2 56%,#fff 66%,#fff 100%);
  background-size:280% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 3s linear infinite;filter:drop-shadow(0 4px 26px rgba(0,0,0,.6))}
@keyframes shine{0%{background-position:170% 0}100%{background-position:-70% 0}}
.nm .amp{-webkit-text-fill-color:#e6bd5f;color:#e6bd5f;animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 6px rgba(230,189,95,.35))}50%{filter:drop-shadow(0 0 18px rgba(230,189,95,.85))}}
.sub{margin-top:14px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:31px;color:#e6ce93;
  text-shadow:0 2px 16px rgba(0,0,0,.6)}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,#ffe6a8 40%,rgba(230,189,95,0) 70%)}
.s1{left:20%;top:58%;animation:tw1 3s ease-in-out infinite}
.s2{left:78%;top:52%;animation:tw2 3s ease-in-out infinite}
.s3{left:60%;top:66%;animation:tw3 3s ease-in-out infinite}
.s4{left:34%;top:70%;animation:tw2 3s ease-in-out infinite}
.s5{left:86%;top:70%;animation:tw3 3s ease-in-out infinite}
@keyframes tw1{0%,100%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.1)}40%{opacity:0;transform:scale(.4)}}
@keyframes tw2{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.1)}70%{opacity:0;transform:scale(.4)}}
@keyframes tw3{0%,100%{opacity:0;transform:scale(.4)}75%{opacity:1;transform:scale(1.1)}95%{opacity:0;transform:scale(.4)}}
.anim{animation-play-state:running}
</style></head>
<body>
<div id="hero">
  <div class="ph anim"></div>
  <div class="scrim"></div><div class="vig"></div>
  <span class="spark s1 anim"></span><span class="spark s2 anim"></span><span class="spark s3 anim"></span>
  <span class="spark s4 anim"></span><span class="spark s5 anim"></span>
  <div class="cap">
    <div class="ey anim">Rebi &amp; Ricci</div>
    <div class="nm anim">REBI <span class="amp">&amp;</span> RICCI</div>
    <div class="sub">come play with us</div>
  </div>
</div>
</body></html>
