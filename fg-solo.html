<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--panel:#0B0B0C;--line:#232326;--warm:#F2EFEA;--mute:#8b8690;--hot:#FF2E7E;}
  *{box-sizing:border-box;margin:0;padding:0;}
  .bar{width:1920px;height:980px;display:flex;background:var(--panel);overflow:hidden;font-family:'Archivo',sans-serif;color:var(--warm);}
  .phwrap{flex:0 0 42%;position:relative;}
  .phwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;
    -webkit-mask-image:linear-gradient(270deg,transparent 0%,rgba(0,0,0,.4) 22%,#000 50%);mask-image:linear-gradient(270deg,transparent 0%,rgba(0,0,0,.4) 22%,#000 50%);}
  .txt{flex:1;padding:82px 300px 82px 70px;display:flex;flex-direction:column;justify-content:center;}
  .eyebrow{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:26px;letter-spacing:.36em;text-transform:uppercase;color:var(--hot);margin-bottom:22px;}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:92px;line-height:.94;letter-spacing:-.01em;text-transform:uppercase;}
  .handle{margin-top:26px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;letter-spacing:.02em;color:var(--warm);}
  .handle span{color:var(--mute);font-weight:600;font-size:23px;letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:4px;}
  .tap{margin-top:22px;display:inline-flex;align-items:center;gap:12px;align-self:flex-start;background:var(--hot);color:#0B0B0C;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:16px 30px;border-radius:8px;}
  .sched{margin-top:44px;border-top:1px solid var(--line);padding-top:30px;}
  .sched .lab{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:24px;letter-spacing:.28em;text-transform:uppercase;color:var(--hot);margin-bottom:20px;}
  .sched .row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line);}
  .sched .row:last-child{border-bottom:none;}
  .sched .z{font-family:'Archivo',sans-serif;font-size:25px;color:var(--mute);}
  .sched .t{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:32px;letter-spacing:.04em;color:var(--warm);}
</style></head>
<body>
<div class="bar">
  <div class="phwrap"><img src="assets/bio/solo-src.jpg"></div>
  <div class="txt">
    <div class="eyebrow">Just Rebi</div>
    <h1>Solo on<br>Fansly</h1>
    <div class="handle"><span>Rebi's Fansly — solo</span>badbunnyyy77</div>
    <div class="tap">Click here for Rebi's Fansly</div>
    <div class="sched">
      <div class="lab">Live every evening</div>
      <div class="row"><span class="z">Vienna &middot; Europe</span><span class="t">from 18:00</span></div>
      <div class="row"><span class="z">New York / Toronto</span><span class="t">from 12:00 PM</span></div>
      <div class="row"><span class="z">Los Angeles / Vancouver</span><span class="t">from 9:00 AM</span></div>
    </div>
  </div>
</div>
</body></html>
