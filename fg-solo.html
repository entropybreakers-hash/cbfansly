<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--warm:#F4F1EC;--mute:#8b8690;--hot:#FF2E7E;--line:rgba(244,241,236,.12);}
  *{box-sizing:border-box;margin:0;padding:0;}
  .bar{width:1920px;height:1120px;display:flex;align-items:stretch;background:#0A0A0B;font-family:'Inter',sans-serif;color:var(--warm);}
  .media{flex:0 0 40%;padding:100px 50px 100px 120px;display:flex;}
  .card{flex:1;position:relative;border-radius:18px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.6);}
  .card .ph{position:absolute;inset:0;background:url('assets/bio/solo-src.jpg') center 16%/cover no-repeat;}
  .txt{flex:1;padding:100px 320px 100px 84px;display:flex;flex-direction:column;justify-content:center;}
  .eyebrow{font-weight:500;font-size:17px;letter-spacing:.26em;text-transform:uppercase;color:var(--hot);margin-bottom:24px;}
  h1{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:60px;line-height:1.05;letter-spacing:0;}
  .lead{margin-top:26px;font-size:23px;font-weight:300;line-height:1.5;color:#c7c2cb;max-width:24ch;}
  .handle{margin-top:36px;font-weight:600;font-size:30px;letter-spacing:-.01em;color:var(--warm);}
  .handle span{display:block;font-weight:500;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:7px;}
  .tap{margin-top:24px;display:inline-flex;align-items:center;gap:12px;align-self:flex-start;background:var(--hot);color:#0A0A0B;font-weight:600;font-size:20px;letter-spacing:.01em;padding:15px 32px;border-radius:999px;}
  .sched{margin-top:42px;border-top:1px solid var(--line);padding-top:26px;max-width:600px;}
  .sched .lab{font-weight:500;font-size:18px;letter-spacing:.04em;color:var(--warm);margin-bottom:6px;}
  .sched .fomo{font-size:18px;font-weight:300;color:var(--hot);margin-bottom:20px;}
  .sched .row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line);}
  .sched .row:last-child{border-bottom:none;}
  .sched .z{font-size:19px;font-weight:300;color:var(--mute);}
  .sched .t{font-weight:500;font-size:22px;color:var(--warm);}
</style></head>
<body>
<div class="bar">
  <div class="media"><div class="card"><div class="ph"></div></div></div>
  <div class="txt">
    <div class="eyebrow">Just me · Fansly</div>
    <h1>Want me all to<br>yourself?</h1>
    <div class="lead">Sweet one minute, a handful the next.</div>
    <div class="handle"><span>I'm at</span>badbunnyyy77</div>
    <div class="tap">Come say hi (click) &#8594;</div>
    <div class="sched">
      <div class="lab">Online every night</div>
      <div class="fomo">I don't record a thing. Miss it and it's gone.</div>
      <div class="row"><span class="z">Vienna · Europe</span><span class="t">from 18:00</span></div>
      <div class="row"><span class="z">New York / Toronto</span><span class="t">from 12:00 PM</span></div>
      <div class="row"><span class="z">Los Angeles / Vancouver</span><span class="t">from 9:00 AM</span></div>
    </div>
  </div>
</div>
</body></html>
