<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--warm:#F5F1E9;--mute:#9a94a0;--hot:#FF6FA5;--gold:#F3C77A;--line:rgba(245,241,233,.16);}
  *{box-sizing:border-box;margin:0;padding:0;}
  .bar{width:1920px;height:1120px;background:#000000;font-family:'Inter',sans-serif;color:var(--warm);
    display:flex;align-items:center;justify-content:center;padding:0 110px;position:relative;overflow:hidden;text-align:center;}
  .a-warm{position:absolute;left:50%;top:20%;width:1500px;height:1000px;transform:translate(-50%,-50%);
    background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(243,199,122,.07) 0%,rgba(243,199,122,0) 70%);filter:blur(34px);}
  .a-pink{position:absolute;left:78%;top:76%;width:1100px;height:1100px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,111,165,.15) 0%,rgba(255,111,165,0) 62%);filter:blur(44px);}
  .a-pink2{position:absolute;left:22%;top:26%;width:820px;height:820px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,111,165,.08) 0%,rgba(255,111,165,0) 60%);filter:blur(46px);}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse 72% 70% at 50% 46%,rgba(8,8,10,0) 42%,rgba(6,6,8,.55) 84%,rgba(4,4,6,.85) 100%);}
  .glass{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;
    max-width:1180px;padding:70px 96px;border-radius:32px;
    background:linear-gradient(180deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,.018) 100%);
    border:1px solid rgba(245,241,233,.10);
    box-shadow:0 44px 100px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(8px) saturate(115%);-webkit-backdrop-filter:blur(8px) saturate(115%);}
  .eyebrow{font-weight:500;font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:var(--hot);margin-bottom:16px;}
  h2{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:56px;line-height:1.0;margin-bottom:8px;}
  .subtitle{font-size:18px;font-weight:300;color:var(--mute);margin-bottom:40px;}
  .king{width:100%;display:flex;align-items:center;gap:20px;padding:20px 26px;border-radius:16px;
    background:linear-gradient(90deg,rgba(243,199,122,.14),rgba(243,199,122,.05));
    border:1px solid rgba(243,199,122,.4);margin-bottom:14px;}
  .king .crown{font-size:34px;line-height:1;}
  .king .nm{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:34px;color:var(--warm);flex:1;text-align:left;}
  .king .amt{font-family:'Inter';font-weight:600;font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .king .amt span{font-size:15px;font-weight:400;color:var(--mute);margin-left:4px;}
  .rows{width:100%;display:flex;flex-direction:column;}
  .row{display:flex;align-items:center;gap:20px;padding:15px 26px;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row .rk{font-family:'Inter';font-weight:600;font-size:15px;color:var(--hot);width:28px;text-align:left;font-variant-numeric:tabular-nums;}
  .row .nm{font-size:21px;font-weight:400;color:var(--warm);flex:1;text-align:left;}
  .row .amt{font-family:'Inter';font-weight:500;font-size:19px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .row .amt span{font-size:13px;margin-left:4px;}
  .closer{margin-top:34px;font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:26px;color:var(--hot);}
</style></head>
<body>
<div class="bar">
  <div class="a-warm"></div>
  <div class="a-pink"></div>
  <div class="a-pink2"></div>
  <div class="vig"></div>
  <div class="glass">
    <div class="eyebrow">Hall of Fame</div>
    <h2>Our Legends</h2>
    <div class="subtitle">One throne. Earned, never given.</div>
    <div class="king">
      <span class="crown">&#128081;</span>
      <span class="nm">Silentwolf75</span>
      <span class="amt">9,530<span>tk</span></span>
    </div>
    <div class="rows">
      <div class="row"><span class="rk">02</span><span class="nm">jonh886378</span><span class="amt">5,562<span>tk</span></span></div>
      <div class="row"><span class="rk">03</span><span class="nm">lawndocterrob</span><span class="amt">3,083<span>tk</span></span></div>
      <div class="row"><span class="rk">04</span><span class="nm">zapata_84</span><span class="amt">2,815<span>tk</span></span></div>
      <div class="row"><span class="rk">05</span><span class="nm">shreddysteve4</span><span class="amt">2,655<span>tk</span></span></div>
    </div>
    <div class="closer">Think you can take the throne?</div>
  </div>
</div>
</body></html>
