<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Anton&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:2560px;height:853px;overflow:hidden;position:relative;color:#fff;}
  body.a{background:radial-gradient(ellipse 70% 110% at 50% 45%,#22383e 0%,#15262b 45%,#08110f 100%);}
  body.c{background:radial-gradient(ellipse 60% 120% at 50% 55%,#4a0b12 0%,#2a0609 45%,#070203 100%);}
  body.c .title{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:158px;letter-spacing:.34em;padding-left:.34em;color:#f3e4d4;text-shadow:0 6px 40px rgba(0,0,0,.6);}
  body.c .fig{filter:saturate(1.12) contrast(1.14) brightness(.94) drop-shadow(0 30px 60px rgba(0,0,0,.75));}
  .glow{position:absolute;left:50%;bottom:0;height:100%;transform:translateX(-50%) scale(1.06);z-index:0;
    filter:blur(70px) sepia(1) saturate(9) hue-rotate(-28deg) brightness(.55);opacity:.85;display:none;}
  body.c .glow{display:block;} body.c .haze{background:radial-gradient(ellipse 34% 70% at 50% 45%,rgba(255,120,90,.16),rgba(255,120,90,0) 70%);}
  body.c .cr{color:rgba(243,228,212,.55);}
  body.b{background:radial-gradient(ellipse 70% 110% at 50% 45%,#2a2a2a 0%,#151515 50%,#000 100%);}
  .haze{position:absolute;inset:0;background:radial-gradient(ellipse 30% 60% at 50% 40%,rgba(255,255,255,.10),rgba(255,255,255,0) 70%);}
  .title{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:max-content;text-align:center;white-space:nowrap;z-index:1;}
  body.a .title{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:158px;letter-spacing:.34em;padding-left:.34em;color:#ece7dc;
    text-shadow:0 6px 40px rgba(0,0,0,.45);}
  body.b .title{font-family:'Anton',sans-serif;font-size:320px;line-height:.86;letter-spacing:.04em;color:#e3202a;top:47%;}
  .fig{position:absolute;left:50%;bottom:0;height:100%;transform:translateX(-50%);z-index:2;}
  body.a .fig{filter:saturate(.62) contrast(1.06) brightness(.92) drop-shadow(0 30px 50px rgba(0,0,0,.6));}
  body.b .fig{filter:grayscale(1) contrast(1.15) brightness(.95) drop-shadow(0 30px 50px rgba(0,0,0,.6));}
  .dust{position:absolute;inset:0;z-index:3;pointer-events:none;}
  .vig{position:absolute;inset:0;z-index:4;background:radial-gradient(ellipse 75% 95% at 50% 50%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 85%,rgba(0,0,0,.85) 100%);}
  .grain{position:absolute;inset:0;z-index:5;opacity:.07;mix-blend-mode:overlay;}
  .cr{position:absolute;z-index:6;font-family:'Inter',sans-serif;font-weight:500;font-size:19px;letter-spacing:.38em;text-transform:uppercase;color:rgba(255,255,255,.62);}
  .cr.l{left:70px;bottom:52px;} .cr.r{right:70px;bottom:52px;text-align:right;} .cr.t{left:70px;top:52px;}
  body.b .cr{color:rgba(255,255,255,.55);}
</style></head>
<body class="a">
<div class="haze"></div>
<div class="title" id="title">FOLLOW &amp; SUBSCRIBE</div>
<img class="glow" id="glow" src="cut/p7.png" alt=""><img class="fig" id="fig" src="cut/p7.png" alt="">
<canvas class="dust" id="dust" width="2560" height="853"></canvas>
<div class="vig"></div>
<svg class="grain" width="2560" height="853"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="cr t">Rebi presents</div>
<div class="cr l">Solo &nbsp;·&nbsp; GFE &nbsp;·&nbsp; Femdom &nbsp;·&nbsp; Findom</div>
<div class="cr r">Fansly &nbsp;/ 2026</div>
<script>
  const q=new URLSearchParams(location.search); document.body.className=q.get('v')||'a';
  if(q.get('img')){fig.src=q.get('img');glow.src=q.get('img');}
  if(document.body.className==='b') title.innerHTML='FOLLOW &amp;<br>SUBSCRIBE';
  if(document.body.className==='a'||document.body.className==='c'){fig.style.left=q.get('fx')||'44%';glow.style.left=fig.style.left;let fs=158;title.style.fontSize=fs+'px';while(title.scrollWidth>2380&&fs>80){fs-=2;title.style.fontSize=fs+'px';}}
  if(q.get('layout')==='side'){title.innerHTML='FOLLOW &amp;<br>SUBSCRIBE';title.style.left='110px';title.style.transform='translateY(-50%)';title.style.textAlign='left';title.style.fontSize='150px';title.style.lineHeight='1.25';title.style.letterSpacing='.28em';title.style.paddingLeft='0';
    for(const el of [fig,glow]){el.style.left='auto';el.style.right='0';el.style.transform='none';el.style.height=q.get('fh')||'100%';
      if(q.get('anchor')==='top'){el.style.bottom='auto';el.style.top='0';}
      if(q.get('fr')) el.style.right=q.get('fr');}
    glow.style.transform='scale(1.06)';
    const fit=()=>{const avail=q.get('avail')?+q.get('avail'):fig.getBoundingClientRect().left-110-90;let fs=150;title.style.fontSize=fs+'px';while(title.scrollWidth>avail&&fs>70){fs-=2;title.style.fontSize=fs+'px';}};
    if(fig.complete) fit(); else fig.onload=fit;}
  if(q.get('layout')==='center'){
    title.innerHTML='FOLLOW<span id="amp">&amp;</span>SUBSCRIBE';
    for(const el of [fig,glow]){el.style.height=q.get('fh')||'100%';if(q.get('anchor')==='top'){el.style.bottom='auto';el.style.top='0';}el.style.left='50%';}
    fig.style.transform='translateX(-50%)';glow.style.transform='translateX(-50%) scale(1.06)';
    const fit=()=>{const fw=fig.getBoundingClientRect().width;const amp=document.getElementById('amp');
      let fs=150;const set=()=>{title.style.fontSize=fs+'px';const aw=amp.getBoundingClientRect().width;const g=Math.max(0,(fw-aw)/2+ (+(q.get('pad')||40)));amp.style.margin='0 '+g+'px';};
      set();while(title.scrollWidth>2400&&fs>80){fs-=2;set();}};
    if(fig.complete) fit(); else fig.onload=fit;}
  const c=dust.getContext('2d'); let s=7;
  const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  for(let i=0;i<80;i++){const x=rnd()*2560,y=rnd()*853,r=.6+rnd()*2.2,o=.08+rnd()*.38;
    c.beginPath();c.arc(x,y,r,0,7);c.fillStyle=`rgba(255,255,255,${o})`;c.shadowColor='rgba(255,255,255,.8)';c.shadowBlur=r*2;c.fill();}
</script>
</body></html>
