<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{overflow:hidden;background:#000;font-family:'Michroma',sans-serif;color:#fff;position:relative;}
  .bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 80% at 50% 45%,#b51c1c 0%,#8c1212 50%,#4a0808 100%);}
  .bg.mono{background:#000 center/cover no-repeat;}
  .floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.28));}
  .fig{position:absolute;left:0;top:0;width:100%;height:100%;filter:drop-shadow(0 30px 50px rgba(0,0,0,.55));}
  .txt{position:absolute;text-shadow:0 4px 30px rgba(0,0,0,.35);}
  .big{letter-spacing:.26em;line-height:1.28;}
  .small{margin-top:26px;letter-spacing:.08em;line-height:1.6;}
</style></head>
<body>
<div class="bg" id="bg"></div>
<div class="floor" id="floor"></div>
<img class="fig" id="fig" alt="">
<div class="txt" id="txt"><div class="big" id="big">FOLLOW &amp;<br>SUBSCRIBE</div></div>
<script>
  const q=new URLSearchParams(location.search), img=q.get('img'), w=+q.get('w'), h=+q.get('h'), mode=q.get('mode')||'studio';
  document.body.style.width=w+'px'; document.body.style.height=h+'px';
  if(mode==='mono'){ bg.className='bg mono'; bg.style.backgroundImage=`url(${img})`; fig.remove(); floor.remove(); }
  else { fig.src=img; }
  const pos=q.get('pos')||'left', x=+(q.get('x')||110), y=+(q.get('y')||110), fs=+(q.get('fs')||150);
  txt.style.top=y+'px'; big.style.fontSize=fs+'px'; 
  if(pos==='left'){txt.style.left=x+'px';txt.style.textAlign='left';}
  else if(pos==='right'){txt.style.right=x+'px';txt.style.textAlign='right';}
  else {txt.style.left='50%';txt.style.transform='translateX(-50%)';txt.style.textAlign='center';txt.style.whiteSpace='nowrap';}
</script>
</body></html>
