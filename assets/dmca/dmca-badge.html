<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:transparent;}
  #wrap{width:1240px;height:560px;position:relative;}
  svg{display:block;width:1240px;height:560px;}
  text{font-family:'Inter',Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:.02em;}
</style></head>
<body>
<div id="wrap">
<svg viewBox="0 0 1240 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ee06a"/>
      <stop offset="1" stop-color="#3fae3f"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a9a3c"/>
      <stop offset="1" stop-color="#0f6b27"/>
    </linearGradient>
    <linearGradient id="fillS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9e40"/>
      <stop offset="1" stop-color="#0c5f22"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- label plate -->
  <g filter="url(#sh)">
    <rect x="290" y="172" width="910" height="236" rx="42" fill="url(#rim)"/>
    <rect x="305" y="187" width="880" height="206" rx="33" fill="url(#fill)"/>
    <rect x="305" y="187" width="880" height="103" rx="33" fill="#fff" opacity=".05"/>
  </g>

  <!-- shield -->
  <g filter="url(#sh)">
    <path d="M80 92 C 150 104 230 66 300 86 C 370 66 450 104 520 92
             C 528 262 470 424 300 508
             C 130 424 72 262 80 92 Z" fill="url(#rim)"/>
    <path d="M106 118 C 168 128 236 96 300 114 C 364 96 432 128 494 118
             C 500 266 448 400 300 476
             C 152 400 100 266 106 118 Z" fill="url(#fillS)"/>
  </g>

  <!-- padlock -->
  <g fill="#fff">
    <path d="M300 176 c-42 0 -68 30 -68 70 v30 h24 v-30 c0 -27 17 -46 44 -46 s44 19 44 46 v30 h24 v-30 c0 -40 -26 -70 -68 -70 z"/>
    <rect x="216" y="270" width="168" height="122" rx="22"/>
    <circle cx="300" cy="318" r="15" fill="#0f6b27"/>
    <rect x="292" y="322" width="16" height="36" rx="6" fill="#0f6b27"/>
  </g>

  <!-- text -->
  <text x="800" y="338" text-anchor="middle" font-size="146" fill="#fff">DMCA</text>
</svg>
</div>
</body></html>
