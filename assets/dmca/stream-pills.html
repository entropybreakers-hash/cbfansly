<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:transparent;font-family:'Inter',Arial,sans-serif;}
  body{padding:20px;display:flex;flex-direction:column;gap:24px;align-items:flex-start;}
  .pill{display:inline-flex;align-items:center;gap:10px;padding:11px 20px 11px 16px;border-radius:999px;white-space:nowrap;}
  .dark{background:rgba(10,10,12,.62);border:1px solid rgba(255,255,255,.30);
    box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18);}
  .light{background:rgba(255,255,255,.70);border:1px solid rgba(255,255,255,.9);
    box-shadow:0 6px 18px rgba(0,0,0,.25);}
  .pill .t{font-size:20px;font-weight:500;letter-spacing:.03em;color:rgba(255,255,255,.92);}
  .pill .t b{font-weight:700;color:#fff;}
  .light .t{color:#111;} .light .t b{color:#000;}
  .ico{width:22px;height:22px;flex:none;}
  .fi{width:28px;height:auto;flex:none;}
  .fx{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#FF6FA5,#d94a86);flex:none;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;}
  .tag{display:inline-flex;align-items:center;padding:7px 16px;border-radius:999px;white-space:nowrap;
    background:rgba(10,10,12,.50);border:1px solid rgba(255,255,255,.18);}
  .tag .t{font-size:15px;font-weight:500;letter-spacing:.06em;color:rgba(255,255,255,.72);}
  .tag .t i{font-style:normal;color:#FF6FA5;margin:0 7px;}
</style></head>
<body>
  <div id="b-dark" class="pill dark">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <span class="t">All content &copy; &ndash; enforced by <b>bruqi.com</b></span>
  </div>
  <div id="b-light" class="pill light">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <span class="t">All content &copy; &ndash; enforced by <b>bruqi.com</b></span>
  </div>
  <div id="f-couple" class="pill dark">
    <img class="fi" src="fansly-icon.png" alt="">
    <span class="t">fansly.com/<b>dreamcouple69</b></span>
  </div>
  <div id="f-solo" class="pill dark">
    <img class="fi" src="fansly-icon.png" alt="">
    <span class="t">fansly.com/<b>badbunnyyy77</b></span>
  </div>
  <div id="t-couple" class="tag"><span class="t">full videos<i>&middot;</i>customs<i>&middot;</i>DMs</span></div>
  <div id="t-solo" class="tag"><span class="t">solo<i>&middot;</i>GFE<i>&middot;</i>femdom<i>&middot;</i>findom</span></div>
  <div id="t-solo2" class="tag"><span class="t">her rules<i>&middot;</i>squirt<i>&middot;</i>findom</span></div>
</body></html>
