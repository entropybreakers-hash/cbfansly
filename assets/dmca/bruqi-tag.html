<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:transparent;}
  #wrap{width:1400px;height:260px;display:flex;align-items:center;justify-content:center;}
  .tag{display:inline-flex;align-items:center;gap:22px;padding:30px 54px;border-radius:14px;
    background:rgba(255,255,255,.90);
    border:1px solid rgba(0,0,0,.28);
    box-shadow:0 10px 30px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.6);}
  .tag .t{font-family:'Inter',Arial,sans-serif;font-weight:700;font-size:44px;letter-spacing:.02em;color:#0a0a0a;white-space:nowrap;}
  .tag .c{font-family:'Inter',Arial,sans-serif;font-weight:600;font-size:44px;color:#0a0a0a;}
  .tag .site{font-weight:700;}
</style></head>
<body>
<div id="wrap">
  <div class="tag"><span class="t">All content &copy; &ndash; enforced by <span class="site">bruqi.com</span></span></div>
</div>
</body></html>
