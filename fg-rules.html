<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--cream:#F5F1E9;--ink:#141210;--soft:#5c574f;--hot:#E11466;--line:rgba(20,18,16,.14);}
  *{box-sizing:border-box;margin:0;padding:0;}
  /* house rules — off-white */
  .bar{width:1920px;height:1120px;background:var(--cream);font-family:'Inter',sans-serif;color:var(--ink);
    display:flex;flex-direction:column;justify-content:center;padding:0 300px;}
  .eyebrow{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--hot);margin-bottom:26px;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:88px;line-height:1;letter-spacing:-.025em;margin-bottom:66px;}
  .rules{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:0 120px;max-width:1260px;}
  .rules li{display:flex;gap:22px;align-items:center;padding:30px 0;border-bottom:1px solid var(--line);font-size:31px;font-weight:300;line-height:1.3;color:var(--soft);}
  .rules li b{font-weight:600;color:var(--ink);}
  .rules li .n{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:19px;color:var(--hot);min-width:30px;}
  .close{margin-top:56px;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:30px;letter-spacing:-.01em;color:var(--ink);}
  .close b{color:var(--hot);font-weight:600;}
</style></head>
<body>
<div class="bar">
  <div class="eyebrow">Read this first</div>
  <h1>House rules</h1>
  <ul class="rules">
    <li><span class="n">01</span><span><b>Tip before you ask.</b> Every time.</span></li>
    <li><span class="n">02</span><span>No haggling. Prices are <b>prices</b>.</span></li>
    <li><span class="n">03</span><span>No cam-to-cam, sorry babe.</span></li>
    <li><span class="n">04</span><span>We won't text back <b>mid-show</b>.</span></li>
    <li><span class="n">05</span><span>Dick pics? <b>Instant block.</b></span></li>
  </ul>
  <div class="close">Be cool about it and we'll <b>spoil you like crazy</b>.</div>
</div>
</body></html>
