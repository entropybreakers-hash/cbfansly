<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--cream:#F5F1E9;--ink:#141210;--soft:#5c574f;--hot:#E11466;--line:rgba(20,18,16,.14);}
  *{box-sizing:border-box;margin:0;padding:0;}
  .bar{width:1920px;height:1120px;background:var(--cream);font-family:'Inter',sans-serif;color:var(--ink);
    display:flex;flex-direction:column;justify-content:center;padding:0 320px;}
  .eyebrow{font-weight:500;font-size:17px;letter-spacing:.28em;text-transform:uppercase;color:var(--hot);margin-bottom:22px;}
  h1{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:64px;line-height:1.0;letter-spacing:0;margin-bottom:56px;}
  .rules{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:0 110px;max-width:1180px;}
  .rules li{display:flex;gap:20px;align-items:center;padding:24px 0;border-bottom:1px solid var(--line);font-size:23px;font-weight:300;line-height:1.3;color:var(--soft);}
  .rules li b{font-weight:600;color:var(--ink);}
  .rules li .n{font-weight:500;font-size:15px;color:var(--hot);min-width:26px;}
  .close{margin-top:44px;font-size:23px;font-weight:400;color:var(--ink);}
  .close b{color:var(--hot);font-weight:600;}
</style></head>
<body>
<div class="bar">
  <div class="eyebrow">Read this first</div>
  <h1>House rules</h1>
  <ul class="rules">
    <li><span class="n">01</span><span><b>Tip before you ask.</b> Every time.</span></li>
    <li><span class="n">02</span><span>No haggling. Prices are <b>prices</b>.</span></li>
    <li><span class="n">03</span><span>No cam-to-cam, sorry babe.</span></li>
    <li><span class="n">04</span><span>We won't text back <b>mid-show</b>.</span></li>
    <li><span class="n">05</span><span>Dick pics? <b>Instant block.</b></span></li>
  </ul>
  <div class="close">Be cool about it and we'll <b>spoil you like crazy</b>.</div>
</div>
</body></html>
