<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--warm:#F5F1E9;--mute:#9a94a0;--hot:#FF6FA5;--line:rgba(245,241,233,.16);}
  *{box-sizing:border-box;margin:0;padding:0;}
  .bar{width:1920px;height:1120px;background:#000000;font-family:'Inter',sans-serif;color:var(--warm);
    display:flex;align-items:center;justify-content:center;padding:0 110px;position:relative;overflow:hidden;text-align:center;}
  /* aurora depth */
  .a-warm{position:absolute;left:50%;top:22%;width:1500px;height:1000px;transform:translate(-50%,-50%);
    background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(245,241,233,.06) 0%,rgba(245,241,233,0) 70%);filter:blur(30px);}
  .a-pink{position:absolute;left:76%;top:74%;width:1150px;height:1150px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,111,165,.16) 0%,rgba(255,111,165,0) 62%);filter:blur(44px);}
  .a-pink2{position:absolute;left:22%;top:26%;width:820px;height:820px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,111,165,.08) 0%,rgba(255,111,165,0) 60%);filter:blur(46px);}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse 72% 70% at 50% 46%,rgba(8,8,10,0) 42%,rgba(6,6,8,.55) 84%,rgba(4,4,6,.85) 100%);}
  /* frosted glass card */
  .glass{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;
    max-width:1620px;padding:88px 130px;border-radius:32px;
    background:linear-gradient(180deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,.018) 100%);
    border:1px solid rgba(245,241,233,.10);
    box-shadow:0 44px 100px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(8px) saturate(115%);-webkit-backdrop-filter:blur(8px) saturate(115%);}
  .eyebrow{font-weight:500;font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:var(--hot);margin-bottom:32px;}
  h1{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:94px;line-height:1.02;letter-spacing:-.01em;max-width:15ch;}
  .sub{margin-top:32px;font-size:29px;font-weight:300;line-height:1.4;color:var(--mute);max-width:900px;}
  .rule{width:66px;height:1px;background:var(--line);margin:48px 0 42px;}
  .offer{font-size:28px;font-weight:400;line-height:1.5;color:var(--warm);max-width:660px;}
  .offer em{font-family:'Fraunces',serif;font-style:italic;font-weight:500;color:var(--hot);}
  .scar{margin-top:24px;font-weight:600;font-size:14px;letter-spacing:.42em;text-transform:uppercase;color:var(--hot);}
</style></head>
<body>
<div class="bar">
  <div class="a-warm"></div>
  <div class="a-pink"></div>
  <div class="a-pink2"></div>
  <div class="vig"></div>
  <div class="glass">
    <div class="eyebrow">On Fansly</div>
    <h1>Whatever you&#8217;re into, it&#8217;s already there.</h1>
    <div class="sub">Soft and slow, rough and filthy, and everything in between.</div>
    <div class="rule"></div>
    <div class="offer">Join any tier today and a full-length film we never posted arrives in your DMs. <em>On us.</em></div>
    <div class="scar">Today only</div>
  </div>
</div>
</body></html>
