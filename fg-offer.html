<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--warm:#F4F1EC;--mute:#9a94a0;--hot:#FF2E7E;}
  *{box-sizing:border-box;margin:0;padding:0;}
  .bar{width:1920px;height:1120px;background:#0A0A0B;font-family:'Inter',sans-serif;color:var(--warm);
    display:flex;align-items:center;justify-content:center;padding:0 260px;position:relative;overflow:hidden;text-align:center;}
  .wash{position:absolute;left:50%;top:50%;width:1500px;height:1500px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,46,126,.20) 0%,rgba(255,46,126,.05) 42%,rgba(255,46,126,0) 66%);}
  .in{position:relative;display:flex;flex-direction:column;align-items:center;max-width:1220px;}
  .badge{display:inline-flex;align-items:center;gap:10px;background:var(--hot);color:#0A0A0B;
    font-weight:700;font-size:20px;letter-spacing:.16em;text-transform:uppercase;padding:12px 26px;border-radius:999px;
    box-shadow:0 10px 34px rgba(255,46,126,.4);margin-bottom:32px;}
  h1{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:88px;line-height:1.0;letter-spacing:0;max-width:16ch;}
  .lead{margin-top:24px;font-size:28px;font-weight:300;color:var(--mute);}
  .hl{margin-top:26px;font-family:'Inter',sans-serif;font-weight:600;font-size:32px;line-height:1.3;color:var(--warm);max-width:26ch;}
  .hl b{color:var(--hot);}
  .fomo{margin-top:18px;font-size:24px;font-weight:500;color:var(--hot);}
  .chips{margin-top:32px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .chip{display:inline-flex;align-items:center;gap:11px;font-weight:600;font-size:20px;color:var(--warm);
    background:rgba(255,46,126,.14);border:1px solid rgba(255,46,126,.5);border-radius:999px;padding:13px 24px;}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:var(--hot);}
  .tap{margin-top:40px;display:inline-flex;align-items:center;gap:14px;background:var(--hot);color:#0A0A0B;
    font-family:'Inter',sans-serif;font-weight:700;font-size:30px;letter-spacing:.01em;padding:24px 56px;border-radius:999px;
    box-shadow:0 22px 60px rgba(255,46,126,.42);}
</style></head>
<body>
<div class="bar">
  <div class="wash"></div>
  <div class="in">
    <div class="badge"><span>&#9889;</span>Limited offer</div>
    <h1>You're missing the best part.</h1>
    <div class="lead">Everyone ends up on Fansly for the full version.</div>
    <div class="hl">Subscribe this week and <b>a video no tier includes is yours, free.</b></div>
    <div class="fomo">After that, it's gone for good.</div>
    <div class="chips">
      <span class="chip"><span class="dot"></span>50% off first month</span>
      <span class="chip"><span class="dot"></span>New members only</span>
    </div>
    <div class="tap">Claim it (click) &#8594; dreamcouple69</div>
  </div>
</div>
</body></html>
