<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--warm:#F4F1EC;--mute:#8b8690;--hot:#FF2E7E;--line:rgba(244,241,236,.12);}
  *{box-sizing:border-box;margin:0;padding:0;}
  .bar{width:1920px;height:1120px;background:#0A0A0B;font-family:'Inter',sans-serif;color:var(--warm);
    display:flex;flex-direction:column;justify-content:center;padding:0 320px;position:relative;}
  .glow{position:absolute;left:14%;top:50%;width:900px;height:900px;transform:translateY(-50%);
    background:radial-gradient(circle,rgba(255,46,126,.14) 0%,rgba(255,46,126,0) 60%);}
  .in{position:relative;}
  .eyebrow{font-weight:500;font-size:17px;letter-spacing:.28em;text-transform:uppercase;color:var(--hot);margin-bottom:22px;}
  h1{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:66px;line-height:1.02;letter-spacing:0;max-width:16ch;}
  .lead{margin-top:26px;font-size:24px;font-weight:300;line-height:1.5;color:#c7c2cb;max-width:34ch;}
  .lead b{color:var(--warm);font-weight:500;}
  .chips{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap;}
  .chip{display:inline-flex;align-items:center;gap:11px;font-weight:500;font-size:19px;color:var(--warm);
    background:rgba(255,46,126,.1);border:1px solid rgba(255,46,126,.4);border-radius:999px;padding:12px 22px;}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--hot);}
  .tap{margin-top:40px;display:inline-flex;align-items:center;gap:14px;align-self:flex-start;background:var(--hot);color:#0A0A0B;
    font-family:'Space Grotesk','Inter',sans-serif;font-weight:600;font-size:26px;letter-spacing:.01em;padding:20px 44px;border-radius:999px;
    box-shadow:0 18px 50px rgba(255,46,126,.28);}
  .small{margin-top:18px;font-size:16px;color:var(--mute);}
</style></head>
<body>
<div class="bar">
  <div class="glow"></div>
  <div class="in">
    <div class="eyebrow">Subscribe today</div>
    <h1>Get the video no tier can unlock.</h1>
    <div class="lead">Free in your DMs the moment you join — <b>a full video you won't find in any tier.</b></div>
    <div class="chips">
      <span class="chip"><span class="dot"></span>Instant in your DMs</span>
      <span class="chip"><span class="dot"></span>50% off first month</span>
      <span class="chip"><span class="dot"></span>This week only</span>
    </div>
    <div class="tap">Claim it — dreamcouple69 &#8594;</div>
  </div>
</div>
</body></html>
