<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--warm:#F5F1E9;--mute:#9a94a0;--hot:#FF6FA5;--line:rgba(245,241,233,.18);}
  *{box-sizing:border-box;margin:0;padding:0;}
  .bar{width:1920px;height:1120px;background:#0A0A0B;font-family:'Inter',sans-serif;color:var(--warm);
    display:flex;align-items:center;justify-content:center;padding:0 260px;position:relative;overflow:hidden;text-align:center;}
  .wash{position:absolute;left:50%;top:44%;width:1500px;height:1500px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,46,126,.10) 0%,rgba(255,46,126,0) 58%);}
  .in{position:relative;display:flex;flex-direction:column;align-items:center;max-width:1180px;}
  .eyebrow{font-weight:500;font-size:15px;letter-spacing:.4em;text-transform:uppercase;color:var(--mute);margin-bottom:34px;}
  h1{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:98px;line-height:1.02;letter-spacing:-.01em;max-width:15ch;}
  .sub{margin-top:34px;font-size:30px;font-weight:300;line-height:1.4;color:var(--mute);max-width:1000px;}
  .rule{width:66px;height:1px;background:var(--line);margin:54px 0 46px;}
  .offer{font-size:29px;font-weight:400;line-height:1.5;color:var(--warm);max-width:680px;}
  .offer em{font-family:'Fraunces',serif;font-style:italic;font-weight:500;color:var(--hot);}
  .scar{margin-top:26px;font-weight:600;font-size:14px;letter-spacing:.42em;text-transform:uppercase;color:var(--hot);}
</style></head>
<body>
<div class="bar">
  <div class="wash"></div>
  <div class="in">
    <div class="eyebrow">On Fansly</div>
    <h1>Whatever you're into, it's already there.</h1>
    <div class="sub">Soft and slow, rough and filthy, and everything in between.</div>
    <div class="rule"></div>
    <div class="offer">Join any tier today and a full-length film we never posted arrives in your DMs. <em>On us.</em></div>
    <div class="scar">Today only</div>
  </div>
</div>
</body></html>
