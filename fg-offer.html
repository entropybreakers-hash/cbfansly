<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--warm:#F4F1EC;--mute:#9a94a0;--hot:#FF2E7E;}
  *{box-sizing:border-box;margin:0;padding:0;}
  .bar{width:1920px;height:1120px;background:#0A0A0B;font-family:'Inter',sans-serif;color:var(--warm);
    display:flex;align-items:center;justify-content:center;padding:0 260px;position:relative;overflow:hidden;text-align:center;}
  .wash{position:absolute;left:50%;top:50%;width:1600px;height:1600px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,46,126,.22) 0%,rgba(255,46,126,.05) 40%,rgba(255,46,126,0) 64%);}
  .in{position:relative;display:flex;flex-direction:column;align-items:center;max-width:1240px;}
  .badge{display:inline-flex;align-items:center;gap:11px;background:var(--hot);color:#0A0A0B;
    font-weight:700;font-size:21px;letter-spacing:.2em;text-transform:uppercase;padding:13px 30px;border-radius:999px;
    box-shadow:0 12px 38px rgba(255,46,126,.45);margin-bottom:48px;}
  h1{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:104px;line-height:1.0;letter-spacing:-.01em;max-width:15ch;}
  .sub{margin-top:44px;font-size:32px;font-weight:300;line-height:1.4;color:var(--mute);max-width:1100px;}
  .close{margin-top:52px;font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:38px;color:var(--hot);}
</style></head>
<body>
<div class="bar">
  <div class="wash"></div>
  <div class="in">
    <div class="badge"><span>&#9889;</span>It's all on Fansly</div>
    <h1>Whatever you're into, it's already there.</h1>
    <div class="sub">Soft and slow, rough and filthy, and everything in between.</div>
    <div class="close">The version you need is waiting.</div>
  </div>
</div>
</body></html>
